<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write To</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc src="be-literate/📖.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <label>Select File
        <input type='file' 📖='{
            "writeTo": "indexedDB://myDB/myFiles/{file.name}"
        }'
        >
    </label>
    <script>
        // fifteenth's set() broadcasts window.postMessage([usp]) (or [usp, usl] when a
        // ?. accessor chain is used) — an Array of Uniform Storage Path strings.
        window.addEventListener('message', e => {
            if(Array.isArray(e.data) && e.data.some(u => u.startsWith('indexedDB://myDB/myFiles/'))){
                console.log('iah', e.data);
            }
        });
    </script>
</body>
</html>
