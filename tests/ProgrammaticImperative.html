<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticImperative</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Fully imperative attachment: no attribute, no `.set` proxy -- just
         `enh.get(emc)` plus a direct property assignment. -->
    <input id="subject" type="file">
    <div id="target"></div>
    <script type=module>
        import {defBeLiterate} from '/def.js';
        const emc = await defBeLiterate(document.body);
        const beLiterate = subject.enh.get(emc);
        Object.assign(beLiterate, {
            writeTo: 'sessionStorage://ProgrammaticImperative-{file.name}',
        });
        // fifteenth's set() broadcasts window.postMessage([usp]) once the write completes.
        window.addEventListener('message', e => {
            if(Array.isArray(e.data) && e.data.includes('sessionStorage://ProgrammaticImperative-hello.txt')
                && sessionStorage.getItem('ProgrammaticImperative-hello.txt') === 'hello'){
                target.setAttribute('mark', 'good');
            }
        });
        // Signal the spec once hydrate has attached the change listener.
        function whenResolved(){
            if(subject.enh.beLiterate?.resolved === true){
                target.setAttribute('ready', '');
                return;
            }
            requestAnimationFrame(whenResolved);
        }
        whenResolved();
    </script>
</body>
</html>
