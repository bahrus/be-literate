<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticDeclarativeOutOfSequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Properties are set via the `.set` proxy *before* the enhancement
         config is even registered. `.set` creates a plain placeholder and
         defers the real spawn until `defBeLiterate` registers the config,
         via EnhancementRegistry.whenDefined. -->
    <input id="subject" type="file">
    <div id="target"></div>
    <script type=module>
        import {defBeLiterate} from '/def.js';
        subject.enh.set.beLiterate.readVerb = 'readAsText';
        subject.enh.beLiterate.writeTo = 'sessionStorage://ProgrammaticDeclarativeOutOfSequence-{file.name}';
        await defBeLiterate(document.body);
        // fifteenth's set() broadcasts window.postMessage([usp]) once the write completes.
        window.addEventListener('message', e => {
            if(Array.isArray(e.data) && e.data.includes('sessionStorage://ProgrammaticDeclarativeOutOfSequence-hello.txt')
                && sessionStorage.getItem('ProgrammaticDeclarativeOutOfSequence-hello.txt') === 'hello'){
                target.setAttribute('mark', 'good');
            }
        });
        // Signal the spec once hydrate has attached the change listener.
        function whenResolved(){
            if(subject.enh.beLiterate?.resolved === true){
                target.setAttribute('ready', '');
                return;
            }
            requestAnimationFrame(whenResolved);
        }
        whenResolved();
    </script>
</body>
</html>
